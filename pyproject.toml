[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "hungerloop"
version = "0.7.0"
description = "HungerLoop Agent Harness"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.0,<3.0",
    "click>=8.0,<9.0",
    "PyYAML>=6.0",
    "httpx>=0.27",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "mypy>=1.10",
    "ruff>=0.4",
    "types-PyYAML>=6.0",
]

[project.scripts]
hungerloop = "hungerloop.cli.main:cli"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests/unit", "tests/integration"]
markers = [
    "perf: micro-benchmark; opt-in via 'pytest tests/perf -m perf'.",
]

[tool.mypy]
python_version = "3.11"
strict = true
# Note: the pydantic.mypy plugin is intentionally not enabled.
# Pydantic v2 models are understood natively by recent mypy releases, and the
# plugin bundled with pydantic 2.13.x crashes against mypy >=1.18 due to an
# internal API mismatch. Re-enable once both upstreams realign.

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I"]
